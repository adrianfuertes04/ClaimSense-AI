services:
  # Vector database for historical claims RAG
  qdrant:
    container_name: claimsense-qdrant
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # Backend API service (FastAPI + ReAct Agent Loop)
  api:
    container_name: claimsense-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-${PORTKEY_API_KEY}}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-${PORTKEY_BASE_URL}}
      - PORTKEY_API_KEY=${PORTKEY_API_KEY}
      - PORTKEY_BASE_URL=${PORTKEY_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./tools:/app/tools

  # Web User Interface (Nginx SPA)
  ui:
    container_name: claimsense-ui
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  qdrant_data:
